memory_type: experiences
description: |
  A reusable SOP DAG distilled from agent execution, stored as a complete Python program.

directory: "viking://user/{{ user_space }}/memories/experiences"
filename_template: "{{ experience_name }}.md"
enabled: true
operation_mode: "upsert"
stage: agent
agent_only: true

fields:
  - name: experience_name
    type: string
    description: |
      The exact canonical Case name supplied by the Session learning context.
      Never rename, translate, split or broaden it. One Case owns one same-named Experience.
    merge_op: immutable

  - name: content
    type: string
    description: |
      Output one complete, standalone Python program as this string field. Do NOT output
      Markdown or DAG JSON. Persisted content is this Python source and must rebuild the DAG
      from an empty graph: always start with `dag = workflow("...")` and include every
      node that the final DAG needs. Existing candidate contents are Python source; rewrite the
      complete source when updating rather than outputting only a mutation.
      Node factories derive the stable slot name from their Python variable:
      - ask("information to obtain")
      - call("available_tool", "parameter suggestion")
      - check("condition to observe in context")
      - tell("action to perform")
      - choose("question whose answer selects one named case")
      Atomic node and evaluation-obligation rules:
      - Every node represents exactly one observable obligation. Split information collection,
        calculation, user communication, confirmation, and state mutation into separate nodes.
      - Words such as "and", "then", "while", "同时", "并且" or "然后" usually indicate that
        a description contains multiple obligations and must be split.
      - Map every concrete requirement in the Case rubric or evaluation feedback to its own node.
        If feedback says required information was not communicated, add a dedicated `tell(...)`
        node for that information; do not hide it inside a generic summary node.
      - `ask(...)` requests exactly one missing value or one explicit confirmation. It must not
        also calculate or communicate required business information.
      - `tell(...)` communicates one result or one closely related result set. State what must be
        communicated, which previously collected evidence it uses, and whether it uses the state
        before or after a mutation.
      - `call(...)` represents one tool obligation. Its description must state the required input
        evidence and intended effect without combining a later confirmation or communication.
      Mutation barrier rules:
      - Before any tool call that creates, updates, cancels, deletes, books, pays, transfers, or
        otherwise changes external state, create explicit predecessor nodes for every required
        pre-action disclosure and for the user's confirmation.
      - Use this order: collect facts -> communicate required pre-action facts -> obtain explicit
        confirmation -> execute state-changing tools -> communicate the final result.
      - Information computed from pre-mutation state must be communicated before the first
        mutation. A post-action summary cannot substitute for a required pre-action disclosure.
      - Never combine a required disclosure and confirmation in one `ask(...)`. For example,
        `ask("Tell the total and ask for confirmation")` is invalid. Use a `tell(...)` node for
        the total followed by a separate `ask(...)` confirmation node.
      Relationship methods use node object variables, never IDs:
      - source.then(target1, target2) creates one-to-many fan-out.
      - condition.if_true(target), condition.if_false(target) define boolean branches.
      - choice.case("label", target), choice.default(target) define named branches.
      A complete conditional looks like:
      eligible = check("Check eligibility")
      cancel = call("cancel_reservation", "Use the confirmed reservation")
      transfer = call("transfer_to_human_agents", "Include the reason")
      eligible.if_true(cancel)
      eligible.if_false(transfer)
      Declare all node variables before relation calls. Every final source needs exactly one
      `dag = workflow(...)` assignment. The compiler generates internal node IDs and reverse
      dependencies. Multiple `.then(target)` edges to the same target are an AND join: that
      target waits for every source node to complete.
      Only node declarations and these relation calls are allowed. No imports, loops, functions,
      arbitrary method calls, attribute access, expressions or real tool execution.
      Graphs must be acyclic and nonempty (a single node is allowed), with at most 256 nodes.
      Predecessors have AND semantics: a node with multiple incoming edges waits until every
      predecessor completes. Use fan-out when later steps are independent.
      Boolean branch slots come from any node connected with `if_true/if_false`; use this form for
      yes/no confirmations so a false answer follows the explicit false edge or terminates that
      branch. Named branch slots come from `choose(...).case/default`.
      Every non-choice slot has a boolean value suitable for a Noul decision. AskUser is true
      only after the requested information appears in context; CallTool is true only after a
      successful matching tool result; TellAgent is true only after the instruction was carried
      out; Check is true only when its condition holds. False or unknown does not advance a
      non-branch node. Never store the actual user answer or tool-result object in slot values;
      those values remain in conversation evidence for the agent to use.
      A choose slot contains exactly one declared `.case(...)` label. When `.default(...)` applies,
      its value is the reserved label `__default__`. Checks are passive; use ask/call when missing
      information requires an action.
      Memory retrieval and lifecycle operations are outside the business DAG. Never create
      nodes for `search_exp`, `search_experience` or `read_experience`.
      Each DAG covers the complete canonical Case, including its dependent intents. Generalize instance-specific identifiers and use only tools
      observed in the input. Preserve alternate paths and put guard conditions before actions.
      Natural-language descriptions must be in {{ language }}; constructor names stay in English.
      Example content:
      dag = workflow("User asks to cancel an order after reviewing the refund")
      order_id = ask("What is the order ID?")
      order = call("query_order", "Use order_id from context")
      tell_refund = tell("Before cancellation, calculate and communicate the refund from the original order")
      confirm_cancel = ask("Ask for explicit confirmation to cancel the order")
      cancel = call("cancel_order", "Cancel the confirmed order")
      tell_result = tell("Communicate the cancellation and refund result")
      order_id.then(order)
      order.then(tell_refund)
      tell_refund.then(confirm_cancel)
      confirm_cancel.then(cancel)
      cancel.then(tell_result)

    merge_op: replace
