memory_type: experiences
description: |
  A reusable conditional-reminder DAG distilled from agent execution, stored as a complete
  Python program. It describes when the agent needs a reminder and what the reminder says;
  it is not a successful action path or an executable SOP.

directory: "viking://user/{{ user_space }}/memories/experiences"
filename_template: "{{ experience_name }}.md"
enabled: true
operation_mode: "upsert"
stage: agent
agent_only: true

fields:
  - name: experience_name
    type: string
    description: |
      The exact canonical Case name supplied by the Session learning context.
      Never rename, translate, split or broaden it. One Case owns one same-named Experience.
    merge_op: immutable

  - name: content
    type: string
    description: |
      Output one complete, standalone Python program as this string field. Do NOT output
      Markdown or DAG JSON. Persisted content is this Python source and must rebuild the DAG
      from an empty graph: always start with `dag = workflow("...")` and include every
      node that the final DAG needs. Existing candidate contents are Python source; rewrite the
      complete source when updating rather than outputting only a mutation.
      Full-replacement SDK syntax is mandatory for this field:
      - Use the system-provided existing-object variable directly. Never call or assign
        `sdk.existing(...)` yourself.
      - Replace an existing DAG with exactly
        `existing_experience.content.update("""<complete DAG source>""")`.
      - Never pass a complete DAG to `content.edit(...)` or `content.drop(...)`; those methods
        are snippet patch operations and are invalid for an Experience replacement.
      Experience semantics:
      - An Experience is a set of conditional reminders, not a task plan, tool trace, successful
        execution path, rubric transcription, or complete SOP.
      - Capture only a non-obvious risk, boundary, exception, calculation scope, ordering hazard,
        or decision rule that the Session evidence shows the agent may otherwise miss.
      - Do not reproduce ordinary task steps that the base policy and tool definitions already
        specify. Do not map every Case requirement or every observed tool call into a node.
      - A Case Experience may contain multiple independent condition-to-reminder rules. Keep
        unrelated rules as separate subgraphs instead of connecting them into an artificial path.
      New Experience DAGs use only these node factories. The Python variable is the stable slot
      name:
      - check("one observable condition in the current conversation or tool evidence")
      - tell("one precise reminder to inject into the agent context")
      The compiler accepts other factories for existing programs, but generated Experiences must
      not use `ask(...)`, `call(...)`, or `choose(...)`. If information or an action is still
      needed, remind the agent what to verify or do; do not turn that action into a DAG step.
      When an existing candidate is an action-path DAG, replace obsolete action nodes with the
      smallest equivalent condition-to-reminder rules rather than preserving its workflow shape.
      Condition rules:
      - Each `check(...)` is a trigger predicate, not an instruction. It must be directly
        decidable from the supplied user messages, assistant messages, or tool results.
      - State the applicability boundary explicitly. Split independent conditions into separate
        check nodes. Multiple `.then(reminder)` edges into the same reminder have AND semantics.
      - Conditions describe evidence that already exists, never future steps that the agent is
        expected to perform. Unknown evidence leaves the reminder inactive.
      Reminder rules:
      - Each `tell(...)` is an instruction shown to the agent when its predecessor conditions are
        satisfied. It is not a claim that the instruction has already been followed.
      - Every root-to-leaf path must end in a `tell(...)` reminder, and reminder nodes must not
        have outgoing edges.
      - Make the reminder actionable and testable: state the exact scope, timing, inclusion or
        exclusion rule, and failure to avoid. Prefer one coherent correction over a generic
        request to "be careful" or a summary of the whole Case.
      - Generalize rollout-specific identifiers and values unless they are invariant parts of the
        canonical Case. Do not invent rules unsupported by the Session or evaluation evidence.
      Relationship methods use node object variables, never IDs:
      - source.then(target1, target2) creates one-to-many fan-out.
      - condition.if_true(target), condition.if_false(target) define boolean branches.
      A boolean branch may route to different reminders, and an omitted branch terminates without
      a reminder. Declare all node variables before relation calls. Every program needs exactly one
      `dag = workflow(...)` assignment. The compiler generates internal node IDs and reverse
      dependencies.
      Only node declarations and these relation calls are allowed. No imports, loops, functions,
      arbitrary method calls, attribute access, expressions or real tool execution.
      Graphs must be acyclic and nonempty (a single node is allowed), with at most 256 nodes.
      Predecessors have AND semantics: a node with multiple incoming edges waits until every
      predecessor condition is satisfied.
      Boolean branch slots come from any node connected with `if_true/if_false`; use this form for
      true/false applicability. A Check is true only when its condition holds. False or unknown
      must not activate a `.then(...)` reminder. TellAgent is the reminder emitted for an active
      rule; whether the agent later follows it is downstream execution evidence, not another
      business-process step in this DAG.
      Memory retrieval and lifecycle operations are outside the business DAG. Never create
      nodes for `search_exp`, `search_experience` or `read_experience`.
      Natural-language descriptions must be in {{ language }}; constructor names stay in English.
      Example content:
      dag = workflow("Remind the agent about the scope of an upcoming-travel total")
      total_requested = check("The user asks for the total cost of upcoming travel")
      reservations_known = check("The context contains every reservation and enough dates and prices to determine which ones are upcoming")
      remind_total_scope = tell("Calculate the total from the pre-mutation state and include every upcoming reservation, including reservations that the user also plans to modify or cancel; show the included items so the scope is unambiguous")
      total_requested.then(remind_total_scope)
      reservations_known.then(remind_total_scope)

    merge_op: replace
